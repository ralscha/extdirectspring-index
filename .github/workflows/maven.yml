name: deploy

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1
    - name: Set up Java 21
      uses: actions/setup-java@v6.3.0
      with:
        distribution: 'temurin'
        java-version: 21
    - name: Build with Maven
      run: ./mvnw -B -ntp verify --file pom.xml
